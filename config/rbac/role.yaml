---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kflare.dev
  resources:
  - cloudflareaccounts
  - dnsrecords
  - kvnamespaces
  - r2buckets
  - ratelimitrules
  - tunnelconfigurations
  - tunnels
  - wafcustomrules
  - workerroutes
  - workerscripts
  - zones
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kflare.dev
  resources:
  - cloudflareaccounts/finalizers
  - dnsrecords/finalizers
  - kvnamespaces/finalizers
  - r2buckets/finalizers
  - ratelimitrules/finalizers
  - tunnelconfigurations/finalizers
  - tunnels/finalizers
  - wafcustomrules/finalizers
  - workerroutes/finalizers
  - workerscripts/finalizers
  - zones/finalizers
  verbs:
  - update
- apiGroups:
  - kflare.dev
  resources:
  - cloudflareaccounts/status
  - dnsrecords/status
  - kvnamespaces/status
  - r2buckets/status
  - ratelimitrules/status
  - tunnelconfigurations/status
  - tunnels/status
  - wafcustomrules/status
  - workerroutes/status
  - workerscripts/status
  - zones/status
  verbs:
  - get
  - patch
  - update
