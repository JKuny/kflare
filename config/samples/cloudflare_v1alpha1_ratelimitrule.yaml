# Allows each client 100 requests to example.com/api/ every 10 seconds, then
# answers its API requests with a JSON error for 10 seconds. A Free plan allows
# one rate limiting rule like this one: counted per IP address over 10
# seconds, with the block action.
apiVersion: kflare.dev/v1alpha1
kind: RateLimitRule
metadata:
  name: example-api-rate-limit
  namespace: default
spec:
  zoneRef:
    name: example-zone        # a Zone in the same namespace
  expression: 'starts_with(http.request.uri.path, "/api/")'
  description: Limit each client to 100 API requests every 10 seconds
  requestsPerPeriod: 100
  # The defaults, spelled out:
  # action: block             # or challenge, js_challenge, managed_challenge (paid plans), log (Enterprise)
  # characteristics: [ip.src] # what requests are counted by; kflare adds cf.colo.id
  # period: 10                # seconds
  # mitigationTimeout: 10     # seconds; defaults to the period
  blockResponse:
    contentType: application/json
    content: '{"error":"rate limited, try again in 10 seconds"}'
    # statusCode: 429
