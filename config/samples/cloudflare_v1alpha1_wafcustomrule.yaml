# Blocks requests to example.com/admin from outside one address range.
apiVersion: kflare.dev/v1alpha1
kind: WAFCustomRule
metadata:
  name: example-block-admin
  namespace: default
spec:
  zoneRef:
    name: example-zone        # a Zone in the same namespace
  expression: 'http.request.uri.path wildcard "/admin*" and not ip.src in {192.0.2.0/24}'
  action: block               # or challenge, js_challenge, managed_challenge, skip, log (Enterprise)
  description: Block the admin pages from outside the office
  priority: 10                # lower runs first among kflare's rules in the zone
---
# Lets health checks through: skips the custom rules after it and the
# rate limiting rules. Priority 0 places it before the block rule above.
apiVersion: kflare.dev/v1alpha1
kind: WAFCustomRule
metadata:
  name: example-skip-health
  namespace: default
spec:
  zoneRef:
    name: example-zone
  expression: 'http.request.uri.path eq "/healthz"'
  action: skip
  skip:
    remainingRules: true
    phases: [http_ratelimit]
    log: false                # skip rules log their matches unless told not to
  priority: 0
